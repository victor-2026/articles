<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1920px; height:1080px; background:#0d1117; color:#e6edf3;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column; justify-content:center; gap:28px;
    padding:60px 110px; overflow:hidden; }
  h2 { font-size:52px; font-weight:800; }
  h2 .g { color:#3fb950; }
  .row { display:flex; gap:32px; align-items:stretch; }
  .panel { background:#161b22; border:1px solid #30363d; border-radius:16px; padding:28px 32px; }
  .panel .lbl { font-size:26px; font-weight:800; letter-spacing:2px; margin-bottom:18px; }
  .before { width:520px; } .before .lbl { color:#3fb950; }
  .after { flex:1; } .after .lbl { color:#f0b429; }
  .form { background:#ffffff; border-radius:12px; padding:30px 34px; color:#111; }
  .form .fl { font-size:20px; color:#555; margin-bottom:8px; }
  .form .fi { border:2px solid #ccc; border-radius:8px; height:48px; margin-bottom:20px; }
  .form .fb { background:#0d6efd; border-radius:8px; height:52px; color:#fff;
    font-size:23px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .forms2 { display:flex; gap:24px; }
  .forms2 .form { flex:1; }
  .arrow { align-self:center; font-size:52px; color:#8b949e; }
  .badge { align-self:center; background:#161b22; border:1px solid #30363d; border-radius:14px;
    padding:20px 40px; font-size:30px; }
  .badge b { color:#f0b429; }
  .stamp { align-self:center; border:3px dashed #f85149; border-radius:14px;
    padding:18px 48px; font-size:32px; font-weight:800; color:#f85149;
    background:rgba(248,81,73,.06); }
</style></head>
<body>
  <h2>One form → 2.20%. Two forms → 3.19%. <span class="g">Report: green both times.</span></h2>
  <div class="row">
    <div class="panel before"><div class="lbl">BEFORE · 1 FORM · <span class="a" style="color:#3fb950">2.20%</span></div>
      <div class="form"><div class="fl">Username</div><div class="fi"></div><div class="fl">Password</div><div class="fi"></div><div class="fb">Sign in</div></div>
    </div>
    <div class="arrow">→</div>
    <div class="panel after"><div class="lbl">AFTER · 2 FORMS · 3.19% (SEEN, +0.99pp)</div>
      <div class="forms2">
        <div class="form"><div class="fl">Username</div><div class="fi"></div><div class="fl">Password</div><div class="fi"></div><div class="fb">Sign in</div></div>
        <div class="form"><div class="fl">Username</div><div class="fi"></div><div class="fl">Password</div><div class="fi"></div><div class="fb">Sign in</div></div>
      </div>
    </div>
  </div>
  <div class="stamp">✗ SAW IT, FLAGGED NOTHING — STILL GREEN</div>
</body></html>
