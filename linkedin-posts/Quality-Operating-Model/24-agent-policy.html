<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1920px; height:1080px; background:#0d1117; color:#e6edf3;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column; justify-content:center; gap:36px;
    padding:80px 110px; overflow:hidden; }
  h2 { font-size:72px; font-weight:800; }
  h2 span { color:#f0b429; }
  .sub { font-size:34px; color:#8b949e; }
  .card { background:#161b22; border:1px solid #30363d; border-radius:16px;
    padding:36px 48px; display:flex; align-items:center; gap:32px; }
  .num { font-size:60px; font-weight:800; width:84px; }
  .card .t { font-size:42px; font-weight:800; }
  .card .d { font-size:33px; color:#8b949e; }
  .c1 { border-left:8px solid #58a6ff; } .c1 .num { color:#58a6ff; }
  .c2 { border-left:8px solid #3fb950; } .c2 .num { color:#3fb950; }
  .c3 { border-left:8px solid #f0b429; } .c3 .num { color:#f0b429; }
  .cta { text-align:center; font-size:40px; font-weight:700; color:#f0b429; }
</style></head>
<body>
  <div>
    <h2>THE AGENT <span>BOUNDARY</span></h2>
    <div class="sub">Four parts. Most teams built one.</div>
  </div>
  <div class="card c1"><div class="num">1</div><div><div class="t">Authorization</div><div class="d">what the agent is allowed to do</div></div></div>
  <div class="card c2"><div class="num">2</div><div><div class="t">Traceability</div><div class="d">what the agent actually did</div></div></div>
  <div class="card c3"><div class="num">3</div><div><div class="t">Auditability</div><div class="d">a report a third party can verify</div></div></div>
  <div class="cta">Who signs the outcome?</div>
</body></html>
